name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Set public asset base
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/AviaryJournal.tsx')
          s = p.read_text()
          s = s.replace('const assetBase=process.env.NEXT_PUBLIC_BASE_PATH ?? "";', 'const assetBase="/my-aviary";')
          p.write_text(s)
          PY
      - run: npm run build:pages
      - run: touch dist/pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
